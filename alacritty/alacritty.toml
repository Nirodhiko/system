[general]
import = [
  "themes/tokyonight_night.toml",
]

[window]
startup_mode = "Fullscreen"

[font]
size = 14

[font.offset]
x = 0
y = 10

[font.glyph_offset]
y = 5

[font.normal]
family = "Fira Code"
style = "Regular"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"

[cursor.style]
shape = "Beam"
blinking = "On"

[mouse]
bindings = [
  { mouse = "Right",  action = "Paste" },
  { mouse = "Middle", mode = "~Vi", action = "PasteSelection" },
]

[keyboard]
bindings = [
  { key = "Return", mods = "Alt",                     action = "ToggleFullscreen" },
  { key = "Space",  mods = "Control", mode = "~Search",  action = "ToggleViMode" },
  { key = "J",      mods = "Control",                    action = "ScrollHalfPageDown" },
  { key = "J",      mods = "Shift",   mode = "Vi|~Search", action = "ScrollHalfPageDown" },
  { key = "K",      mods = "Control",                    action = "ScrollHalfPageUp" },
  { key = "K",      mods = "Shift",   mode = "Vi|~Search", action = "ScrollHalfPageUp" },
]
